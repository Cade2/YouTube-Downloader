name: pulltube
description: Personal YouTube downloader with a polished dark UI.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # YouTube stream fetching
  youtube_explode_dart: ^2.3.3

  # HTTP client for downloading streams
  dio: ^5.4.3+1

  # Save videos to photo library
  photo_manager: ^3.3.0

  # Storage/photo permissions
  permission_handler: ^11.3.1

  # Google Fonts (DM Sans)
  google_fonts: ^6.2.1

  # Shimmer loading effect
  shimmer: ^3.0.0

  # Cached network images (thumbnails)
  cached_network_image: ^3.3.1

  # File paths
  path_provider: ^2.1.3

flutter:
  uses-material-design: true
